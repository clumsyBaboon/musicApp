<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-mobile.css">
    <link rel="stylesheet" href="aqua-design.css">
</head>
<body>
    <div id="settings-wrapper">
        <div id="settings">
            <h2>Auto connect at start</h2>
            <input type="checkbox" id="autoConnectAtStart">

            <h2>Auto scroll lyrics</h2>
            <input type="checkbox" id="autoScrollLyrics">

            <h2>Select preferable type of lyrics</h2>
            <select id="lyricsType">
                <option value="plain">Plain</option>
                <option value="syn">Synced</option>
                <option value="word-syn">Word-Synced</option>
            </select>

            <button class="secondary" onclick="settings_save()" style="grid-column: span 2;">&nbsp;&nbsp;&nbsp;&nbsp; Save &nbsp;&nbsp;&nbsp;&nbsp;</button>

            <h2>Get token</h2>
            <button class="secondary" onclick="connect_api()">Get</button>

            <h2>Connect to YTM Desktop</h2>
            <button class="secondary" onclick="connect_ws()">Connect</button>

            <h2>Open fullscreen</h2>
            <button class="secondary" onclick="fullscreen()">Open</button>

            <button class="primary" onclick="settings_close()" style="grid-column: span 2;">&nbsp;&nbsp;&nbsp;&nbsp; Close &nbsp;&nbsp;&nbsp;&nbsp;</button>
        </div>
    </div>

    <div class="music-playback-wrapper">
        <div class="album-photo pos-4" id="photo1" onclick="loop_from_site(1)"></div>
        <div class="album-photo pos-3" id="photo2" onclick="loop_from_site(2)"></div>
        <div class="album-photo pos-2" id="photo3" onclick="loop_from_site(3)"></div>
        <div class="album-photo pos-1" id="photo4" onclick="loop_from_site(4)"></div>
        <div class="album-photo pos0" id="photo5" onclick="loop_from_site(5)"></div>
        <div class="album-photo pos1" id="photo6" onclick="loop_from_site(6)"></div>
        <div class="album-photo pos2" id="photo7" onclick="loop_from_site(7)"></div>
        <div class="album-photo pos3" id="photo8" onclick="loop_from_site(8)"></div>
        <div class="album-photo pos4" id="photo9" onclick="loop_from_site(9)"></div>

        <div class="wrapper">
            <h1 id="music-name" class="show-control-opacity">Name</h1>
            <h2 id="music-author" class="show-control-opacity">Author</h2>
            <div class="music-range-wrapper show-control-opacity">
                <p id="duration-now">0:00</p>
                <div class="music-range-bg-wrapper">
                    <div class="unfilled_range"></div>
                    <div class="filled_range"></div>
                    <input type="range" id="music-range" min="0" max="1000" value="0">
                </div>
                <p id="duration-left">-3:28</p>
            </div>
            <div class="control-buttons-wrapper show-control-opacity">
                <button class="btn" id="btn-prev" onclick="command_prev()">
                    <img src="./img/prev.svg" alt="Previous">
                </button>
                <button class="btn" id="btn-stop-play" onclick="command_play_pause()">
                    <img src="./img/play.svg" alt="Stop Play" id="play-pause-img">
                </button>
                <button class="btn" id="btn-next" onclick="command_next()">
                    <img src="./img/next.svg" alt="Next">
                </button>
            </div>
        </div>
        
    </div>
    <div class="lyrics-wrapper">
        <div class=".wrapper"></div>
        <p class="active">Loading...</p>
        <div class=".wrapper"></div>
    </div>
    <button class="settings-btn btn" onclick="openSettings()">Settings</button>
    <button class="lyrics-btn btn" onclick="lyrics()">Lyrics</button>
    
    <!--  -->
    <!-- <button class="_lyrics" onclick="lyrics()">LYRICS</button> -->
    <!--  -->

    <script src="script.js"></script>
</body>
</html>
